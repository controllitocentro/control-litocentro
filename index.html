<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de producción FM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f1f5f9; }
    .badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body class="pb-16">

  <!-- ENCABEZADO Y SELECTOR DE USUARIOS -->
  <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div>
        <h1 class="text-xl font-black tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-industry text-amber-400"></i> Control de producción FM
        </h1>
        <p class="text-xs text-slate-400">Sedes: Centro & Estrada</p>
      </div>

      <!-- Selector de Perfil / Usuario -->
      <div class="flex items-center bg-slate-800 p-1.5 rounded-lg border border-slate-700">
        <span class="text-xs mr-2 text-slate-300 font-medium">Usuario:</span>
        <select id="selectUsuario" onchange="cambiarUsuario(this.value)" class="bg-slate-900 text-white text-xs font-bold p-1.5 rounded border border-slate-600 focus:outline-none">
          <option value="admin">👤 Administrador (Dueño)</option>
          <option value="milton">🖨️ Milton (Prensista Impresión)</option>
          <option value="hector">✨ Héctor (Plastificador)</option>
          <option value="johnatan">📦 Johnatan (Pegue de Cajas)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- AVISO DINÁMICO DE PERFIL -->
    <div id="roleNotice" class="p-3 bg-blue-50 border-l-4 border-blue-500 text-blue-900 rounded-r-lg text-sm flex items-center justify-between shadow-sm">
      <!-- Generado por JS -->
    </div>

    <!-- SECCIÓN SOLO ADMIN: GESTIÓN DE CLIENTES Y TARIFAS -->
    <section id="sectionTarifas" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-600"></i> Lista de Clientes y Precios
        </h2>
        <button onclick="toggleTarifasForm()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg font-bold">
          <i class="fa-solid fa-gear mr-1"></i> Configurar / Agregar Clientes
        </button>
      </div>

      <div id="tarifasContent" class="hidden text-xs space-y-4 border-t pt-3">
        <form id="formAddCliente" onsubmit="guardarNuevoCliente(event)" class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
          <p class="font-bold text-slate-700"><i class="fa-solid fa-user-plus mr-1 text-blue-600"></i> Agregar o Modificar Cliente:</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2">
            <div>
              <label class="block text-slate-600 font-semibold mb-1">Nombre Cliente</label>
              <input type="text" id="cliNombre" placeholder="Ej. Empaques Caribe" class="w-full p-2 border rounded bg-white text-xs" required>
            </div>
            <div>
              <label class="block text-slate-600 font-semibold mb-1">WhatsApp Cliente (Sin +57)</label>
              <input type="tel" id="cliTel" placeholder="Ej. 3001234567" class="w-full p-2 border rounded bg-white text-xs" required>
            </div>
            <div>
              <label class="block text-slate-600 font-semibold mb-1">Precio x Unidad ($)</label>
              <input type="number" id="cliTarifa" placeholder="Ej. 25" class="w-full p-2 border rounded bg-white text-xs" required>
            </div>
            <div>
              <label class="block text-slate-600 font-semibold mb-1">Valor Mínimo ($)</label>
              <input type="number" id="cliMinima" placeholder="Ej. 70000" class="w-full p-2 border rounded bg-white text-xs" required>
            </div>
          </div>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded text-xs transition-all shadow">
            Guardar Cliente en Lista
          </button>
        </form>

        <p class="text-slate-500 font-semibold">Clientes registrados actualmente:</p>
        <div id="listaTarifas" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <!-- Render dinámico -->
        </div>
      </div>
    </section>

    <!-- SECCIÓN SOLO ADMIN: CREAR OP -->
    <section id="sectionCreateOrder" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-file-circle-plus text-blue-600"></i> Crear Nueva Orden de Producción
      </h2>
      <form id="formNewOrder" onsubmit="handleCreateOrder(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Sede / Local</label>
          <select id="inputLocal" class="w-full p-2 border rounded-lg text-xs bg-slate-50" required>
            <option value="Centro">Centro</option>
            <option value="Estrada">Estrada</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">N° Remisión Física</label>
          <input type="text" id="inputRemision" placeholder="Ej. REM-4521" class="w-full p-2 border rounded-lg text-xs" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Cliente</label>
          <select id="inputCliente" onchange="actualizarPrecioEstimado()" class="w-full p-2 border rounded-lg text-xs bg-slate-50" required>
            <!-- Dinámico -->
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono WhatsApp Cliente</label>
          <input type="tel" id="inputTel" placeholder="Ej. 3001234567" class="w-full p-2 border rounded-lg text-xs" required>
        </div>

        <div>
          <label class="block text-xs font-bold text-indigo-900 mb-1">Tipo de Proceso (Asigna el Operario)</label>
          <select id="inputTipoProceso" onchange="onChangeTipoProceso()" class="w-full p-2 border rounded-lg text-xs bg-indigo-50 font-bold text-indigo-900" required>
            <option value="Impresión">Impresión (Operario: Milton)</option>
            <option value="Plastificado">Plastificado (Operario: Héctor)</option>
            <option value="Pegue de cajas">Pegue de cajas (Operario: Johnatan)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Cantidad (Unidades)</label>
          <input type="number" id="inputCantidad" onkeyup="actualizarPrecioEstimado()" placeholder="Ej. 5000" class="w-full p-2 border rounded-lg text-xs" required>
        </div>

        <!-- CAMPOS DINÁMICOS POR PROCESO -->
        <div id="containerDinamico" class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-3 rounded-lg border border-slate-200">
        </div>

        <div class="sm:col-span-2 bg-slate-100 p-3 rounded-lg border border-slate-300 flex justify-between items-center">
          <div>
            <span class="text-xs text-slate-500 font-semibold">Valor Sugerido (Según Cliente):</span>
            <div id="precioSugeridoTxt" class="text-sm font-bold text-indigo-700">$0 COP</div>
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition-all shadow">
            Guardar Orden
          </button>
        </div>
      </form>
    </section>

    <!-- LISTA DE TRABAJOS SEGÚN PERFIL -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-slate-700"></i> Órdenes de Producción
        </h2>
        <span id="orderCount" class="text-xs bg-slate-100 font-bold px-2.5 py-1 rounded-full text-slate-600">0 Órdenes</span>
      </div>

      <div id="ordersContainer" class="space-y-4">
        <!-- Render dinámico de tarjetas -->
      </div>
    </section>

  </main>

  <script>
    let currentUser = 'admin'; // 'admin', 'milton', 'hector', 'johnatan'
    const PIN_ADMIN = "1234"; // PIN de seguridad para ingresar como Administrador
    const CELULAR_JEFE = "573115926645";
    let timerInterval = null;

    let tarifasClientes = JSON.parse(localStorage.getItem('fastmark_tarifas')) || {
      "Cliente General": { tarifaUnidad: 25, minima: 70000, tel: "3000000000" },
      "Empaques del Caribe": { tarifaUnidad: 22, minima: 65000, tel: "3001234567" },
      "Diseños & Impresos": { tarifaUnidad: 30, minima: 90000, tel: "3159876543" }
    };

    let orders = JSON.parse(localStorage.getItem('fastmark_orders')) || [];

    function saveStorage() {
      localStorage.setItem('fastmark_tarifas', JSON.stringify(tarifasClientes));
      localStorage.setItem('fastmark_orders', JSON.stringify(orders));
    }

    function init() {
      renderClientesSelect();
      renderTarifas();
      onChangeTipoProceso();
      updateNotice();
      renderOrders();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        orders.forEach(o => {
          if (o.estado === 'En Ejecución' && o.startTime) {
            const diffMs = new Date() - new Date(o.startTime);
            const el = document.getElementById(`timer-${o.id}`);
            if (el) el.innerText = formatDuration(diffMs);
          }
        });
      }, 1000);
    }

    function formatDuration(ms) {
      const totalSec = Math.floor(ms / 1000);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      return `${hours > 0 ? hours + 'h ' : ''}${minutes}m ${seconds}s`;
    }

    function cambiarUsuario(usuario) {
      if (usuario === 'admin') {
        const pinIngresado = prompt("Ingresa el PIN de Administrador:");
        if (pinIngresado !== PIN_ADMIN) {
          alert("PIN incorrecto. No tienes acceso a las funciones administrativas.");
          document.getElementById('selectUsuario').value = currentUser;
          return;
        }
      }
      currentUser = usuario;
      updateNotice();
      renderOrders();
    }

    function updateNotice() {
      const notice = document.getElementById('roleNotice');
      const secCreate = document.getElementById('sectionCreateOrder');
      const secTarifas = document.getElementById('sectionTarifas');

      if (currentUser === 'admin') {
        secCreate.classList.remove('hidden');
        secTarifas.classList.remove('hidden');
        notice.className = "p-3 bg-blue-50 border-l-4 border-blue-500 text-blue-900 rounded-r-lg text-sm shadow-sm";
        notice.innerHTML = `<span><i class="fa-solid fa-user-shield text-blue-600 mr-1"></i> <strong>Modo Administrador:</strong> Control de órdenes, tarifas, cobros e historial completo.</span>`;
      } else {
        secCreate.classList.add('hidden');
        secTarifas.classList.add('hidden');
        notice.className = "p-3 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-900 rounded-r-lg text-sm shadow-sm";
        
        if (currentUser === 'milton') {
          notice.innerHTML = `<span><i class="fa-solid fa-print text-emerald-600 mr-1"></i> <strong>Operario Milton:</strong> Visualizando únicamente órdenes de <strong>Impresión</strong>.</span>`;
        } else if (currentUser === 'hector') {
          notice.innerHTML = `<span><i class="fa-solid fa-layer-group text-emerald-600 mr-1"></i> <strong>Operario Héctor:</strong> Visualizando únicamente órdenes de <strong>Plastificado</strong>.</span>`;
        } else if (currentUser === 'johnatan') {
          notice.innerHTML = `<span><i class="fa-solid fa-box-open text-emerald-600 mr-1"></i> <strong>Operario Johnatan:</strong> Visualizando únicamente órdenes de <strong>Pegue de cajas</strong>.</span>`;
        }
      }
    }

    function onChangeTipoProceso() {
      const tipo = document.getElementById('inputTipoProceso').value;
      const container = document.getElementById('containerDinamico');
      container.innerHTML = "";

      if (tipo === 'Impresión') {
        container.innerHTML = `
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-700 mb-1">Observaciones de Impresión</label>
            <input type="text" id="inputObs" placeholder="Ej. Papel propalcote 150g, impresión tiro y retiro" class="w-full p-2 border rounded text-xs bg-white">
          </div>`;
      } else if (tipo === 'Plastificado') {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo de Plástico</label>
            <select id="inputTipoPlastico" class="w-full p-2 border rounded text-xs bg-white font-semibold">
              <option value="Plástico corriente">Plástico corriente</option>
              <option value="Plástico Dry brillante">Plástico Dry brillante</option>
              <option value="Plástico Mate">Plástico Mate</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Observaciones de Plastificado</label>
            <input type="text" id="inputObs" placeholder="Ej. Plastificado una sola cara" class="w-full p-2 border rounded text-xs bg-white">
          </div>`;
      } else if (tipo === 'Pegue de cajas') {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo de Pegue</label>
            <select id="inputTipoPegue" class="w-full p-2 border rounded text-xs bg-white font-semibold">
              <option value="Pegue lateral">Pegue lateral</option>
              <option value="Pegue automático">Pegue automático</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo de Pegante</label>
            <select id="inputTipoPegante" class="w-full p-2 border rounded text-xs bg-white font-semibold">
              <option value="Pegante normal">Pegante normal</option>
              <option value="Pegante especial">Pegante especial</option>
            </select>
          </div>`;
      }
    }

    function toggleTarifasForm() {
      document.getElementById('tarifasContent').classList.toggle('hidden');
    }

    function guardarNuevoCliente(e) {
      e.preventDefault();
      const nombre = document.getElementById('cliNombre').value.trim();
      const tel = document.getElementById('cliTel').value.trim().replace(/\D/g,'');
      const tarifa = parseFloat(document.getElementById('cliTarifa').value) || 0;
      const minima = parseFloat(document.getElementById('cliMinima').value) || 0;

      if (!nombre) return;

      tarifasClientes[nombre] = { tarifaUnidad: tarifa, minima: minima, tel: tel };
      saveStorage();
      renderClientesSelect();
      renderTarifas();
      document.getElementById('formAddCliente').reset();
      alert(`Cliente "${nombre}" guardado.`);
    }

    function eliminarCliente(nombre) {
      if (confirm(`¿Eliminar a "${nombre}"?`)) {
        delete tarifasClientes[nombre];
        saveStorage();
        renderClientesSelect();
        renderTarifas();
      }
    }

    function renderClientesSelect() {
      const select = document.getElementById('inputCliente');
      select.innerHTML = "";
      Object.keys(tarifasClientes).forEach(cli => {
        select.innerHTML += `<option value="${cli}">${cli}</option>`;
      });
      actualizarPrecioEstimado();
    }

    function renderTarifas() {
      const container = document.getElementById('listaTarifas');
      container.innerHTML = "";
      Object.entries(tarifasClientes).forEach(([cli, data]) => {
        container.innerHTML += `
          <div class="bg-slate-50 p-2.5 rounded border border-slate-200 flex justify-between items-center">
            <div>
              <p class="font-bold text-slate-800">${cli}</p>
              <p class="text-slate-500 text-[10px]">Tel: ${data.tel || 'Sin registrar'}</p>
            </div>
            <div class="text-right">
              <span class="font-bold text-indigo-700">$${data.tarifaUnidad}/und</span>
              <p class="text-[10px] text-slate-500">Mín: $${data.minima.toLocaleString('es-CO')}</p>
            </div>
            <button onclick="eliminarCliente('${cli}')" class="text-red-500 hover:text-red-700 ml-2 p-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>`;
      });
    }

    function actualizarPrecioEstimado() {
      const cli = document.getElementById('inputCliente').value;
      const cant = parseInt(document.getElementById('inputCantidad').value) || 0;
      const telInput = document.getElementById('inputTel');

      if (tarifasClientes[cli]) {
        telInput.value = tarifasClientes[cli].tel || '';
        const tarifa = tarifasClientes[cli];
        let valor = cant * tarifa.tarifaUnidad;
        if (valor < tarifa.minima && cant > 0) valor = tarifa.minima;
        document.getElementById('precioSugeridoTxt').innerText = `$${valor.toLocaleString('es-CO')} COP`;
      }
    }

    function handleCreateOrder(e) {
      e.preventDefault();
      const cli = document.getElementById('inputCliente').value;
      const cant = parseInt(document.getElementById('inputCantidad').value) || 0;
      const tarifa = tarifasClientes[cli] || { tarifaUnidad: 25, minima: 70000 };

      let valCalc = cant * tarifa.tarifaUnidad;
      if (valCalc < tarifa.minima && cant > 0) valCalc = tarifa.minima;

      const tipoProceso = document.getElementById('inputTipoProceso').value;
      let detalleTrabajo = tipoProceso;

      if (tipoProceso === 'Impresión') {
        const obs = document.getElementById('inputObs').value;
        if (obs) detalleTrabajo += ` (${obs})`;
      } else if (tipoProceso === 'Plastificado') {
        const plast = document.getElementById('inputTipoPlastico').value;
        const obs = document.getElementById('inputObs').value;
        detalleTrabajo += ` - ${plast}`;
        if (obs) detalleTrabajo += ` (${obs})`;
      } else if (tipoProceso === 'Pegue de cajas') {
        const pegue = document.getElementById('inputTipoPegue').value;
        const pegante = document.getElementById('inputTipoPegante').value;
        detalleTrabajo += ` - ${pegue} (${pegante})`;
      }

      const newOrder = {
        id: "OP-" + Math.floor(100 + Math.random() * 900),
        local: document.getElementById('inputLocal').value,
        remision: document.getElementById('inputRemision').value,
        cliente: cli,
        telefono: "57" + document.getElementById('inputTel').value.replace(/\D/g,''),
        proceso: tipoProceso,
        trabajo: detalleTrabajo,
        cantidad: cant,
        estado: "Pendiente",
        startTime: null,
        endTime: null,
        tiempos: "Sin iniciar",
        consumos: "",
        valorCalculado: valCalc,
        pagado: false,
        medioPago: "Pendiente"
      };

      orders.unshift(newOrder);
      saveStorage();
      document.getElementById('formNewOrder').reset();
      onChangeTipoProceso();
      renderOrders();
      alert(`Orden ${newOrder.id} registrada exitosamente.`);
    }

    function startJob(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.estado = 'En Ejecución';
        order.startTime = new Date().toISOString();
        saveStorage();
        renderOrders();
      }
    }

    function finishJob(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.estado = 'Terminado';
        order.endTime = new Date().toISOString();

        if (order.startTime) {
          const diffMs = new Date(order.endTime) - new Date(order.startTime);
          order.tiempos = formatDuration(diffMs);
        } else {
          order.tiempos = "No cronometrado";
        }

        const inputConsumo = document.getElementById(`consumo-${id}`);
        if (inputConsumo) order.consumos = inputConsumo.value;

        saveStorage();
        renderOrders();

        const msjJefe = `🚨 *TRABAJO TERMINADO EN PLANTA*%0A%0A📄 *Orden:* ${order.id}%0A📌 *Remisión N°:* ${order.remision}%0A🏢 *Sede:* ${order.local}%0A👤 *Cliente:* ${order.cliente}%0A⚙️ *Proceso:* ${order.trabajo}%0A📦 *Cantidad:* ${order.cantidad.toLocaleString('es-CO')} unds%0A⏱️ *Tiempo Total Laborado:* ${order.tiempos}%0A🧪 *Consumos:* ${order.consumos || 'Ninguno registrado'}%0A%0AYa puedes ingresar a la app para efectuar la liquidación y enviar la notificación al cliente.`;

        const urlJefe = `https://wa.me/${CELULAR_JEFE}?text=${msjJefe}`;
        window.open(urlJefe, '_blank');
      }
    }

    function sendWhatsAppClient(id) {
      const order = orders.find(o => o.id === id);
      const valInput = document.getElementById(`val-${id}`);
      const pagoSelect = document.getElementById(`pago-${id}`);
      const medioSelect = document.getElementById(`medio-${id}`);

      if (valInput) order.valorCalculado = parseFloat(valInput.value) || 0;
      if (pagoSelect) order.pagado = pagoSelect.value === 'true';
      if (medioSelect) order.medioPago = medioSelect.value;

      order.estado = 'Liquidado';
      saveStorage();

      const estadoPagoTxt = order.pagado ? `✅ *PAGADO* (${order.medioPago})` : `⏳ *PENDIENTE DE PAGO*`;

      const mensaje = `Hola *${order.cliente}*! 👋%0A%0ATe informamos que tu pedido (*${order.trabajo}*) correspondiente a la Remisión *N° ${order.remision}* ya está terminado y listo para entregar/recoger.%0A%0A📦 *Cantidad:* ${order.cantidad.toLocaleString('es-CO')} unds%0A💵 *Valor a cancelar:* $${Number(order.valorCalculado).toLocaleString('es-CO')} COP%0A📌 *Estado Pago:* ${estadoPagoTxt}%0A%0AQuedamos atentos a tu confirmación. ¡Muchas gracias por elegir *FM*!`;

      const url = `https://wa.me/${order.telefono}?text=${mensaje}`;
      window.open(url, '_blank');
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById('ordersContainer');
      
      // FILTRAR ÓRDENES SEGÚN EL USUARIO ACTUAL
      let filteredOrders = orders;
      if (currentUser === 'milton') {
        filteredOrders = orders.filter(o => o.proceso === 'Impresión');
      } else if (currentUser === 'hector') {
        filteredOrders = orders.filter(o => o.proceso === 'Plastificado');
      } else if (currentUser === 'johnatan') {
        filteredOrders = orders.filter(o => o.proceso === 'Pegue de cajas');
      }

      document.getElementById('orderCount').innerText = `${filteredOrders.length} Órdenes`;
      container.innerHTML = "";

      if (filteredOrders.length === 0) {
        container.innerHTML = `<div class="text-center p-8 text-slate-400 text-xs">No hay órdenes asignadas para este perfil actualmente.</div>`;
        return;
      }

      filteredOrders.forEach(order => {
        let badgeColor = "bg-slate-200 text-slate-700";
        if (order.estado === 'En Ejecución') badgeColor = "bg-amber-100 text-amber-800 border border-amber-300 font-bold animate-pulse";
        if (order.estado === 'Terminado') badgeColor = "bg-emerald-100 text-emerald-800 border border-emerald-400 font-bold";
        if (order.estado === 'Liquidado') badgeColor = "bg-blue-100 text-blue-800 border border-blue-300";

        let cardHtml = `
          <div class="border border-slate-200 rounded-xl p-4 bg-white shadow-sm space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
              <div>
                <span class="font-extrabold text-slate-800 text-sm">${order.id}</span>
                <span class="text-xs bg-slate-100 font-semibold text-slate-600 px-2 py-0.5 rounded ml-2">${order.remision}</span>
                <span class="text-xs text-indigo-600 font-bold block sm:inline sm:ml-2">(Sede: ${order.local})</span>
              </div>
              <span class="badge ${badgeColor}">${order.estado.toUpperCase()}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs text-slate-600">
              <p><strong>Cliente:</strong> ${order.cliente}</p>
              <p><strong>Detalle Proceso:</strong> ${order.trabajo}</p>
              <p><strong>Cantidad:</strong> ${order.cantidad.toLocaleString('es-CO')} unds</p>
              <p><strong>Tiempo Registrado:</strong> <span class="font-bold text-slate-800" id="timer-${order.id}">${order.tiempos}</span></p>
            </div>`;

        // VISTA PARA CUALQUIERA DE LOS OPERARIOS
        if (currentUser !== 'admin') {
          if (order.estado === 'Pendiente') {
            cardHtml += `
              <button onclick="startJob('${order.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 shadow">
                <i class="fa-solid fa-play"></i> Iniciar Arranque de Producción
              </button>`;
          } else if (order.estado === 'En Ejecución') {
            cardHtml += `
              <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 space-y-2">
                <p class="text-xs text-amber-900 font-bold flex items-center gap-2">
                  <i class="fa-solid fa-spinner fa-spin text-amber-600"></i> Producción en curso...
                </p>
                <div>
                  <label class="block text-[11px] text-slate-600 font-semibold mb-1">Consumos / Insumos:</label>
                  <input type="text" id="consumo-${order.id}" placeholder="Ej. 2.5 kg Pega PVA / 1 Rollo Polipropileno" value="${order.consumos}" class="w-full p-1.5 border rounded text-xs bg-white">
                </div>
                <button onclick="finishJob('${order.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 shadow">
                  <i class="fa-solid fa-stop"></i> Terminar Trabajo y Avisar al Jefe
                </button>
              </div>`;
          } else {
            cardHtml += `<p class="text-xs text-emerald-700 font-bold bg-emerald-50 p-2 rounded text-center">✓ Trabajo Finalizado (${order.tiempos})</p>`;
          }
        }

        // VISTA ADMINISTRADOR (DUEÑO)
        else {
          cardHtml += `
            <div class="bg-slate-50 p-3 rounded-lg text-xs space-y-2 border border-slate-200">
              <div class="flex justify-between items-center text-slate-500">
                <span>Tiempo Total: <strong>${order.tiempos}</strong></span>
                <span>Consumos: <strong>${order.consumos || 'Ninguno'}</strong></span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2 border-t border-slate-200">
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Valor a Cobrar (COP):</label>
                  <input type="number" id="val-${order.id}" value="${order.valorCalculado}" class="w-full p-1.5 border rounded font-bold text-indigo-700 bg-white">
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Estado del Pago:</label>
                  <select id="pago-${order.id}" class="w-full p-1.5 border rounded bg-white">
                    <option value="false" ${!order.pagado ? 'selected' : ''}>Pendiente</option>
                    <option value="true" ${order.pagado ? 'selected' : ''}>Pagado</option>
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Medio de Pago:</label>
                  <select id="medio-${order.id}" class="w-full p-1.5 border rounded bg-white">
                    <option value="Efectivo" ${order.medioPago==='Efectivo'?'selected':''}>Efectivo</option>
                    <option value="Nequi" ${order.medioPago==='Nequi'?'selected':''}>Nequi</option>
                    <option value="Bancolombia" ${order.medioPago==='Bancolombia'?'selected':''}>Bancolombia</option>
                    <option value="Pendiente" ${order.medioPago==='Pendiente'?'selected':''}>Por Cobrar</option>
                  </select>
                </div>
              </div>

              <div class="pt-2 flex justify-end">
                <button onclick="sendWhatsAppClient('${order.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-1.5 shadow">
                  <i class="fa-brands fa-whatsapp text-sm"></i> Notificar Cliente por WhatsApp
                </button>
              </div>
            </div>`;
        }

        cardHtml += `</div>`;
        container.innerHTML += cardHtml;
      });
    }

    init();
  </script>
</body>
</html>
